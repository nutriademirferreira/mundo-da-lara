<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Letras — conferência dos traços</title>
<!--
  Folha pra conferir as letras do Escrever em tamanho grande, do jeito
  que a tela do app desenha: a pauta, a estrada, o caminho da caneta e
  as bolinhas de partida (numeradas na maiúscula). Usa os MESMOS dados e
  a MESMA função de partida do app (Traco.partidas), então o que aparece
  aqui é o que a Lara vê.
  Abrir pelo servidor local: http://localhost:8949/ferramentas/letras.html
-->
<style>
  body{margin:0;padding:14px;background:#F6F2FF;font:14px/1.3 system-ui,sans-serif;color:#2B1B54}
  h2{margin:18px 4px 8px}
  .grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
  .cel{background:#fff;border:1px solid #E4DCF5;border-radius:12px;padding:4px 4px 2px;text-align:center}
  .cel b{font-size:16px}
  svg{display:block;width:100%;height:auto}
  .pauta line{stroke:#E4DCF5;stroke-width:.6}
  .pauta .pauta--meio{stroke-dasharray:2 2}
  .pauta .pauta--base{stroke:#C4B2EC;stroke-width:.9}
  .estrada{fill:none;stroke:#E9E3F7;stroke-width:13;stroke-linecap:round;stroke-linejoin:round}
  .caneta{fill:none;stroke:#2B1B54;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .partida{fill:#2ECC71;stroke:#fff;stroke-width:1.6}
  .partida__n{font-size:7.5px;font-weight:900;fill:#fff;text-anchor:middle;dominant-baseline:central}
</style>
</head>
<body>
<div id="folha"></div>
<script src="../js/data-cursiva.js"></script>
<script src="../js/data-maiuscula.js"></script>
<script src="../js/cursiva.js"></script>
<script>
var NS = 'http://www.w3.org/2000/svg';
var folha = document.getElementById('folha');
Object.keys(Traco.ALFABETOS).forEach(function (nome) {
  var A = Traco.ALFABETOS[nome];
  folha.insertAdjacentHTML('beforeend', '<h2>' + A.titulo + '</h2><div class="grade" id="g-' + nome + '"></div>');
  var grade = document.getElementById('g-' + nome);
  A.ordem.forEach(function (l) {
    var L = A.letras[l];
    var cel = document.createElement('div');
    cel.className = 'cel';
    cel.innerHTML = '<b>' + l + '</b> <small>' + L.d.length + (L.d.length > 1 ? ' traços' : ' traço') + '</small>';
    var svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', '0 0 100 130');
    svg.innerHTML = '<g class="pauta">' + A.pauta.map(function (p) {
        return '<line x1="0" y1="' + p[0] + '" x2="100" y2="' + p[0] + '"' + (p[1] ? ' class="' + p[1] + '"' : '') + '/>';
      }).join('') + '</g>' +
      '<g class="letra" transform="' + A.inclina + '">' +
        L.d.map(function (d) { return '<path class="estrada" d="' + d + '"/>'; }).join('') +
        L.d.map(function (d) { return '<path class="caneta" d="' + d + '"/>'; }).join('') +
      '</g>';
    cel.appendChild(svg);
    grade.appendChild(cel);
    var g = svg.querySelector('.letra');
    var numerar = A.numerar && L.d.length > 1;
    var postos = Traco.partidas(Array.prototype.slice.call(svg.querySelectorAll('.estrada')));
    if (!numerar) postos = postos.slice(0, 1);
    postos.forEach(function (p, i) {
      g.insertAdjacentHTML('beforeend', '<circle class="partida" cx="' + p.x + '" cy="' + p.y + '" r="' + (numerar ? 6 : 5.5) + '"/>' +
        (numerar ? '<text class="partida__n" x="' + p.x + '" y="' + p.y + '">' + (i + 1) + '</text>' : ''));
    });
  });
});
</script>
</body>
</html>
