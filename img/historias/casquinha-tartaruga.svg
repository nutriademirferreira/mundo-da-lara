<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 380 420" role="img"><title>Casquinha ouvindo o mar na concha da saudade</title><desc>Praia ao anoitecer com lua e estrelas. O caranguejo Cutuca encosta uma concha branca no ouvido da tartaruguinha Casquinha, que fecha os olhos e lembra da vovo cantando. A gaivota Zinha voa no ceu e, longe, do outro lado das pedras, a Vovo Mare nada no mesmo mar. Na areia da frente ficou o coracao que a onda quase apagou.</desc>
