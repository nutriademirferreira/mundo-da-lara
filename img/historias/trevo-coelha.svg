<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 380 420" role="img"><title>Trevo dando a primeira mordidinha na cenoura roxa</title><desc>Horta a noite com lua e estrelas. Trevo, a coelhinha de uma orelha em pe e a outra dobrada, fecha os olhos no canteiro e morde a pontinha de uma cenoura roxa. Pinta, a joaninha, esta pousada na folha do lado, Vovo Alecrim espera com a cesta cheia e Rabisco, o caracol, empurra um tomate miudo.</desc>
