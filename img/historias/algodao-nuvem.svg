<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 380 420" role="img"><title>Algodão, a nuvem mais quietinha do céu, regando a florzinha Dourada</title><desc>Campo ao anoitecer com lua e estrelas. A nuvenzinha Algodão desceu baixinho e para logo em cima da florzinha dourada, fazendo sombra e soltando uma chuva bem fininha, pingo por pingo, até a flor levantar a cabecinha. Zabumba, a nuvem grandona, dorme longe atrás da montanha, a andorinha Riscadinha voa em zigue-zague e a vaquinha Manchinha descansa no capim.</desc>
