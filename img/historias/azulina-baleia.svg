<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 380 420" role="img"><title>Azulina no colo de baleia de Dona Marola, com o sonho chegando</title><desc>Mar a noite, escuro e cheio de estrelas, com a lua crescente. Dona Marola abre a nadadeira enorme e faz um colo para a baleiazinha Azulina, que dorme no centro com um brilho morninho em volta e tres z de sono. A agua-viva Lanterninha fica acesa a esquerda e a golfinha Espuma dorme encostada numa alga, perto da areia.</desc>
