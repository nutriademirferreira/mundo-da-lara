<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 380 420" role="img"><title>Brasa respirando devagar com a Vovó Fagulha</title><desc>Montanha de pedras redondas no céu laranja do fim da tarde. A Vovó Fagulha, uma dragoa grande, senta nas pedras ao lado do dragãozinho Brasa, com a asa em volta das costas dele, e respira bem devagar junto com ele. A fumacinha sai do nariz do Brasa do tamanho de uma maçã, encolhe até ficar do tamanho de uma uva e sobe para as nuvens. Tufo, o cabritinho, está deitado nas pedras mornas e Pituca, a passarinha, dorme com o biquinho escondido na asa.</desc>
