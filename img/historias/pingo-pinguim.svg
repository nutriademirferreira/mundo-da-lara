<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 380 420" role="img"><title>Pingo descendo a Ladeira Branca</title><desc>Noite de neve com lua e estrelas. O pinguinzinho Pingo desce a Ladeira Branca deitado de barriga no gelo, com os olhinhos bem abertos e as asinhas abertas pra se equilibrar, e chega na água com um splash. No alto da ladeira, a vovó Nevinha abre a asa e a foca Bigodinho comemora.</desc>
