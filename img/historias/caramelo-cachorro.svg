<svg width="100%" viewBox="0 0 380 420" role="img" xmlns="http://www.w3.org/2000/svg"><title>Vovó Canela abraçando Caramelo e Farelo no quintal</title><desc>Quintal de uma casa amarela à noite, com lua, muro e mangueira. A Vovó Canela abre os dois braços e abraça ao mesmo tempo Caramelo, o cachorrinho caramelo que abana o rabo, e o filhote pretinho Farelo. A gata Fubá observa do alto do muro e dois potes de ração esperam no chão.</desc>
