<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 380 420" role="img"><title>Bolhinha acendendo as oito cores no fundo do mar</title><desc>Fundo do mar a noite, dentro de uma nuvem de areia escura. O polvinho Bolhinha brilha no centro com cada bracinho de uma cor, piscando como estrelinha. Atras dele vem o peixinho Dedal, depois o cavalo-marinho Fiapo e, no fim da fila, a tartaruga Vovo Casquinha, seguindo as cores ate a casinha de pedra.</desc>
