<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 380 420" role="img"><title>Pintinha leva Nina pela patinha ate a roda da escolinha</title><desc>Jardim no fim da tarde, com lua e estrelas surgindo. Pintinha, a joaninha de sete pintinhas, segura a patinha de Nina, a lagartinha verdinha, e as duas entram na roda da escolinha dos insetos. Dona Mel, a abelha professora, abre um lugar para as duas; Zequinha, o grilo, toca sua musiquinha e a vovo Dalva olha de perto da folha de hortela.</desc>
